name: blockengine
prefix: BLOCKENGINE
version: '${version}'

main: dev.auto.blockengine.Main
bootstrapper: dev.auto.blockengine.PluginBootDriver
api-version: '26.3'
load: POSTWORLD

authors: [ AutoYT, Codex ]

dependencies:
  server:
    AutoLib:
      load: BEFORE
      required: false
      join-classpath: true
    packetevents:
      load: BEFORE
      required: true
      join-classpath: true

permissions:
  blockengine.debug:
    description: Allows access to BlockEngine debug commands.
    default: op
  blockengine.structure:
    description: Allows BlockEngine placeholder structure-building items, wand actions, and placeholder pick-block.
    default: op
