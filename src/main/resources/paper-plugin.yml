name: blockengine
prefix: BLOCKENGINE
version: '${version}'

main: dev.auto.blockengine.Main
bootstrapper: dev.auto.blockengine.PluginBootDriver
api-version: '26.1'
load: STARTUP

authors: [ AutoYT, Codex ]

permissions:
  blockengine.debug:
    description: Allows access to BlockEngine debug commands.
    default: op
  blockengine.structure:
    description: Allows BlockEngine sudo structure-building items, wand actions, and sudo pick-block.
    default: op
