custom-blocks:
  backing-block: BARRIER

visibility:
  enabled: true
  chunks:
    radius: 5
    clamp-to-server-view-distance: true
    loaded-chunks-only: true
  entities:
    recycle: true
  exposure:
    enabled: true
    treat-liquid-as-exposed: true
    treat-passable-as-exposed: true
    treat-non-solid-as-exposed: true

resource-pack:
  enabled: true
  generate-on-startup: true
  hosting:
    enabled: true
    host: "0.0.0.0"
    port: 8123
    public-url: ""
    file-name: "BlockEngine-resource-pack.zip"
  send:
    on-join: true
    required: false
    prompt: "This server uses BlockEngine custom block resources."
