name: Publish Docs

on:
  push:
    branches:
      - master
    paths:
      - "docs/**"
      - "blockengine-api/src/main/java/**"
      - "blockengine-api/build.gradle.kts"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/publish-docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Install docs dependencies
        working-directory: docs
        run: npm ci

      - name: Build Starlight docs
        working-directory: docs
        run: npm run build

      - name: Generate Java API docs
        run: ./gradlew :blockengine-api:javadoc

      - name: Copy Java API docs into Pages site
        run: cp -R blockengine-api/build/docs/javadoc docs/dist/api

      - name: Build Pages artifact
        run: echo "Pages artifact prepared at docs/dist"

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/dist

  deploy:
    name: Deploy documentation
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
